name: Update stable branch

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stable
  cancel-in-progress: false

jobs:
  update-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move stable to the latest release tag
        shell: bash
        run: |
          latest_tag=
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          test -n "$latest_tag"
          test "$latest_tag" = "v$(tr -d '[:space:]' < VERSION)" || { echo "::error::VERSION must match release tag $latest_tag"; exit 1; }
          latest_commit="$(git rev-list -n 1 "$latest_tag")"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$latest_commit" origin/main
          git push origin "$latest_commit:refs/heads/stable"
