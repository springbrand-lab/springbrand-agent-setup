name: Validate Codex Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      synchronized: ${{ steps.synchronize.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject development packages on the production channel
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          targets_main = (
              os.environ["CHANNEL_REF"] == "refs/heads/main"
              or (os.environ["CHANNEL_EVENT"] == "pull_request"
                  and os.environ["CHANNEL_BASE"] == "main")
          )
          if targets_main and "-dev." in Path("VERSION").read_text().strip():
              raise SystemExit("Development releases must not be merged into main")
          PY
      - name: Synchronize production Skills before merge
        id: synchronize
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          version = Path("VERSION").read_text().strip()
          if "-dev." in version:
              raise SystemExit("Development releases must not be merged into main")
          PY
          python3 tests/test_release_identity.py
          python3 scripts/sync_skill_versions.py
          python3 tests/validate_plugin.py
          if git diff --quiet -- skills plugins/springbrand/skills plugins/springbrand-workbuddy/skills; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- skills plugins/springbrand/skills plugins/springbrand-workbuddy/skills
          git commit -m 'chore: synchronize Skill versions and distribution mirrors'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          # GITHUB_TOKEN pushes do not trigger another PR workflow. Dispatch
          # explicitly so checks belong to the synchronized commit, not its parent.
          gh workflow run validate-plugin.yml --ref "$HEAD_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  package-contract:
    needs: prepare-package
    if: needs.prepare-package.outputs.synchronized != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate package contract
        run: |
          python3 scripts/sync_skill_versions.py --check
          python3 tests/test_skill_versions.py
          python3 tests/test_production_skill_sync.py
          python3 tests/test_production_channel.py
          python3 tests/test_release_identity.py
          python3 tests/test_action_discovery.py
          python3 tests/validate_plugin.py
          python3 tests/test_validator.py
          python3 tests/test_repair_cursor_plugin.py
          python3 tests/test_repair_workbuddy_plugin.py
          python3 tests/test_build_dev_variant.py
          python3 tests/test_hook.py
          python3 tests/test_routing_policy.py
          python3 tests/test_upload_recipe.py
          python3 tests/test_install_guidance.py
          python3 tests/test_release_package.py
          python3 tests/test_workbuddy_migration.py

  native-cli-smoke:
    needs: prepare-package
    if: needs.prepare-package.outputs.synchronized != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install Codex CLI 0.147.0
        run: npm install --global @openai/codex@0.147.0
      - name: Verify CLI version
        run: |
          codex --version | grep -Eq '(^|[^0-9])0\.147\.0([^0-9]|$)'
      - name: Discover the repository Marketplace
        env:
          HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json > marketplace-add.json
          codex plugin marketplace list --json > marketplace-list.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          added = json.loads(Path("marketplace-add.json").read_text())
          listed = json.loads(Path("marketplace-list.json").read_text())
          assert added["marketplaceName"] == "springbrand", added
          assert any(item["name"] == "springbrand" for item in listed["marketplaces"]), listed
          PY
      - name: Install the Plugin through Codex
        env:
          HOME: ${{ runner.temp }}/codex-home
        run: |
          codex plugin add springbrand --marketplace springbrand --json > plugin-add.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          installed = json.loads(Path("plugin-add.json").read_text())
          assert installed["name"] == "springbrand", installed
          assert installed["marketplaceName"] == "springbrand", installed
          assert installed["version"] == Path("VERSION").read_text().strip(), installed
          PY
