name: Validate Codex Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate package contract
        run: |
          python3 tests/validate_plugin.py
          python3 tests/test_validator.py
          python3 tests/test_repair_cursor_plugin.py
          python3 tests/test_repair_workbuddy_plugin.py
          python3 tests/test_build_dev_variant.py
          python3 tests/test_hook.py
          python3 tests/test_routing_policy.py
          python3 tests/test_install_guidance.py

  native-cli-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install Codex CLI 0.147.0
        run: npm install --global @openai/codex@0.147.0
      - name: Verify CLI version
        run: |
          codex --version | grep -Eq '(^|[^0-9])0\.147\.0([^0-9]|$)'
      - name: Discover the repository Marketplace
        env:
          HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json > marketplace-add.json
          codex plugin marketplace list --json > marketplace-list.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          added = json.loads(Path("marketplace-add.json").read_text())
          listed = json.loads(Path("marketplace-list.json").read_text())
          assert added["marketplaceName"] == "springbrand-dev", added
          assert any(item["name"] == "springbrand-dev" for item in listed["marketplaces"]), listed
          PY
      - name: Install the Plugin through Codex
        env:
          HOME: ${{ runner.temp }}/codex-home
        run: |
          codex plugin add springbrand-dev --marketplace springbrand-dev --json > plugin-add.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          installed = json.loads(Path("plugin-add.json").read_text())
          assert installed["name"] == "springbrand-dev", installed
          assert installed["marketplaceName"] == "springbrand-dev", installed
          assert installed["version"] == Path("VERSION").read_text().strip(), installed
          PY
